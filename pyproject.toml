[project]
name = "desk"
version = "0.1.0"
description = "Paper-trading terminal for Polymarket 15-minute Ethereum Up or Down markets."
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.34.6",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk = "desk.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
